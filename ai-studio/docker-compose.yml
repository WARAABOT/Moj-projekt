services:
  studio:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Caddy sam nabavi HTTPS certifikat za tvoju domenu
  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
