<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Showreel 2026</title>
<style>
  html,body{margin:0;background:#0B0B0F;overflow:hidden}
  canvas{display:block;width:100vw;height:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================================
   SHOWREEL 2026 — 15s motion design reel
   Deterministic renderer: window.render(t) draws the frame at time t (s).
   Open in a browser to preview in real time; render.mjs exports frames.
   ========================================================================= */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DURATION = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#0B0B0F', cream: '#F2EEE6', red: '#FF3B2F',
  lime: '#C8FF3C', violet: '#6A4CFF', white: '#FFFFFF'
};
const FONT = '"Inter Display", "Inter", sans-serif';
const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';

/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inBack: x => { const c1 = 1.70158, c3 = c1 + 1; return c3 * x * x * x - c1 * x * x; },
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1,
  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2,
};
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const bump = (t, a, b) => { const p = P(t, a, b); return Math.sin(p * Math.PI); };

/* ---------- text helpers ---------- */
function setFont(size, weight = 900, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }

function fitSize(str, targetW, maxSize, weight = 900) {
  setFont(100, weight);
  return Math.min(maxSize, 100 * targetW / ctx.measureText(str).width);
}

/* Per-letter masked reveal (letters rise from behind a clipping band). */
function revealText(str, x, y, size, o) {
  const {
    t, start, dur = 0.6, stagger = 0.04, color = C.cream, weight = 900,
    align = 'center', tracking = 0, outline = false, ease = E.outExpo,
    exitStart = null, exitDur = 0.45, fam = FONT, lineWidth = 2
  } = o;
  setFont(size, weight, fam);
  const chars = [...str];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.save();
  ctx.beginPath();
  ctx.rect(cx - size, y - size * 1.02, total + size * 2, size * 1.3);
  ctx.clip();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  if (outline) { ctx.strokeStyle = color; ctx.lineWidth = lineWidth; } else ctx.fillStyle = color;
  chars.forEach((ch, i) => {
    const s = start + i * stagger;
    const p = ease(P(t, s, s + dur));
    let off = (1 - p) * size * 1.1;
    if (exitStart !== null) {
      const es = exitStart + i * stagger * 0.6;
      off -= E.inExpo(P(t, es, es + exitDur)) * size * 1.15;
    }
    if (p > 0) {
      if (outline) ctx.strokeText(ch, cx, y + off); else ctx.fillText(ch, cx, y + off);
    }
    cx += widths[i] + tracking;
  });
  ctx.restore();
  return total;
}

/* Typewriter mono text with cursor */
function typeText(str, x, y, size, t, start, cps, color, align = 'left', cursor = true) {
  setFont(size, 500, MONO);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  const n = Math.floor(clamp((t - start) * cps, 0, str.length));
  if (t < start) return;
  const s = str.slice(0, n);
  ctx.fillText(s, x, y);
  if (cursor && (n < str.length || Math.floor(t * 4) % 2 === 0)) {
    const w = ctx.measureText(s).width;
    const bx = align === 'left' ? x + w + 4 : align === 'center' ? x + w / 2 + 4 : x + 4;
    ctx.fillRect(bx, y - size * 0.8, size * 0.55, size * 0.95);
  }
  ctx.textAlign = 'left';
}

/* ---------- shape morph geometry ---------- */
const NP = 240;
function circlePts(R) {
  const a = [];
  for (let k = 0; k < NP; k++) { const ang = -Math.PI / 2 + k / NP * Math.PI * 2; a.push([Math.cos(ang) * R, Math.sin(ang) * R]); }
  return a;
}
function polyPts(n, R, inner = null) {
  const m = inner ? n * 2 : n, verts = [];
  for (let i = 0; i < m; i++) {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / m;
    const r = inner && i % 2 ? inner : R;
    verts.push([Math.cos(ang) * r, Math.sin(ang) * r]);
  }
  const seg = []; let L = 0;
  for (let i = 0; i < m; i++) { const a = verts[i], b = verts[(i + 1) % m]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push(l); L += l; }
  const pts = [];
  for (let k = 0; k < NP; k++) {
    let d = k / NP * L, i = 0;
    while (d > seg[i]) { d -= seg[i]; i++; }
    const a = verts[i], b = verts[(i + 1) % m], f = d / seg[i];
    pts.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]);
  }
  return pts;
}
const SHAPES = {
  circle: circlePts(230),
  square: polyPts(4, 290),
  tri: polyPts(3, 330),
  star: polyPts(5, 340, 150),
};
const MORPH_KEYS = [[2.85, 'square'], [3.40, 'tri'], [3.95, 'star']];
function shapeAt(t) {
  let cur = SHAPES.circle.map(p => p.slice());
  let rot = t * 0.45;
  for (const [kt, name] of MORPH_KEYS) {
    const m = E.inOutExpo(P(t, kt - 0.32, kt));
    const tgt = SHAPES[name];
    cur = cur.map((p, i) => [lerp(p[0], tgt[i][0], m), lerp(p[1], tgt[i][1], m)]);
    rot += m * Math.PI / 2;
  }
  return { pts: cur, rot };
}
function pathPts(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
}

/* ---------- precomputed assets ---------- */
const grain = document.createElement('canvas');
grain.width = grain.height = 256;
{
  const g = grain.getContext('2d'), id = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
const grainPat = ctx.createPattern(grain, 'repeat');

// 3D particle sets
const NPTS = 900;
const R3 = rng(42);
const PART = [];
{
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < NPTS; i++) {
    const y = 1 - (i / (NPTS - 1)) * 2, rad = Math.sqrt(1 - y * y), th = golden * i;
    const sph = [Math.cos(th) * rad * 330, y * 330, Math.sin(th) * rad * 330];
    const u = (i * 0.6180339887 % 1) * Math.PI * 2, v = (i / NPTS) * Math.PI * 2 * 37;
    const tor = [(300 + 115 * Math.cos(v)) * Math.cos(u), 115 * Math.sin(v), (300 + 115 * Math.cos(v)) * Math.sin(u)];
    const rnd = [(R3() - .5) * 3600, (R3() - .5) * 2400, (R3() - .5) * 2400 - 300];
    PART.push({ sph, tor, rnd, d1: R3(), d2: R3() });
  }
}
const PAL3D = Array.from({ length: 24 }, (_, i) => mix(C.lime, C.violet, i / 23));

/* ---------- global camera shake on hits ---------- */
const HITS = [1.05, 2.2, 4.72, 5.05, 5.4, 5.75, 6.3, 7.2, 9.82, 12.3, 13.2];
function shake(t) {
  let a = 0;
  for (const h of HITS) if (t >= h) a += 12 * Math.exp(-(t - h) * 16);
  return [a * Math.sin(t * 97.3), a * Math.cos(t * 83.1)];
}

/* =========================================================================
   SCENE 1 — UVOD (0 – 2.2): dot → line → MOTION
   ========================================================================= */
function scene1(t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);

  // expanding rings
  [C.red, C.lime, C.violet].forEach((col, i) => {
    const p = E.outExpo(P(t, 1.05 + i * 0.09, 2.1 + i * 0.09));
    if (p <= 0 || p >= 1) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = (1 - p) * 26;
    ctx.beginPath(); ctx.arc(CX, CY, 40 + p * 1250, 0, Math.PI * 2); ctx.stroke();
  });

  // dot pop + anticipation squash + stretch into line
  const pop = E.outBack(P(t, 0.08, 0.42));
  const squash = bump(t, 0.42, 0.6);
  const st = E.inOutExpo(P(t, 0.55, 1.0));
  const split = E.outExpo(P(t, 1.0, 1.5));
  const shrink = E.inOutExpo(P(t, 1.5, 2.0));
  let w = lerp(32 * pop, 1480, st) * (1 + squash * 0.35) * lerp(1, 0.62, shrink);
  let h = lerp(32 * pop, 6, st) * (1 - squash * 0.3);
  ctx.fillStyle = C.red;
  if (split <= 0) {
    rr(CX - w / 2, CY - h / 2, w, h, h / 2); ctx.fill();
  } else {
    const dy = split * 200;
    rr(CX - w / 2, CY - dy - h / 2, w, h, h / 2); ctx.fill();
    rr(CX - w / 2, CY + dy - h / 2, w, h, h / 2); ctx.fill();
  }

  // headline
  const trk = lerp(0, 34, E.outCubic(P(t, 1.1, 2.2)));
  revealText('MOTION', CX, CY + 108, 300, { t, start: 1.02, dur: 0.55, stagger: 0.035, color: C.cream, tracking: trk });
  if (t > 1.35) {
    setFont(22, 500, MONO);
    typeText('SHOWREEL — 2026 — MOTION DESIGN', CX - 245, CY + 262, 22, t, 1.35, 60, C.cream, 'left', false);
  }

  // exit: circle wipe reveals scene 2
}
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}

/* =========================================================================
   SCENE 2 — FORMA (1.85 – 4.72): dot field + morphing shape
   ========================================================================= */
function scene2(t) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);

  const appear = E.outBack(P(t, 1.95, 2.5));
  const pre = bump(t, 4.12, 4.32) * 0.14;
  const blow = E.inExpo(P(t, 4.3, 4.72));
  const scale = appear * (1 - pre) * (1 + blow * 22);
  const Reff = 270 * scale;

  // dot field with radial wave and shape repel
  const sp = 60, cols = 33, rows = 19, ox = CX - (cols - 1) * sp / 2, oy = CY - (rows - 1) * sp / 2;
  ctx.fillStyle = C.ink;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    let x = ox + i * sp, y = oy + j * sp;
    const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) || 1;
    const ap = E.outExpo(P(t, 1.95 + d / 1600 * 0.5, 2.55 + d / 1600 * 0.5));
    if (ap <= 0) continue;
    const wv = Math.sin(d * 0.017 - t * 7) * 0.5 + 0.5;
    let nd = d + wv * 8;
    const minD = Reff + 70;
    if (nd < minD) nd = lerp(nd, minD, 0.85);
    x = CX + dx / d * nd; y = CY + dy / d * nd;
    const r = (1.6 + 4.2 * wv) * ap;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // echo outline (delayed)
  const echo = shapeAt(t - 0.12);
  ctx.save();
  ctx.translate(CX + 22 * scale, CY + 22 * scale);
  ctx.rotate(echo.rot); ctx.scale(scale, scale);
  pathPts(echo.pts);
  ctx.lineWidth = 3 / Math.max(scale, 0.01);
  ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.restore();

  // main shape
  const sh = shapeAt(t);
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(sh.rot); ctx.scale(scale, scale);
  pathPts(sh.pts); ctx.fillStyle = C.red; ctx.fill();
  ctx.restore();

  if (blow > 0.98) return;
  // typography
  revealText('FORMA', 140, 930, 150, { t, start: 2.3, dur: 0.6, stagger: 0.04, color: C.ink, align: 'left', exitStart: 4.1, exitDur: 0.3 });
  typeText('02 — oblik · ritam · tempo', 146, 985, 22, t, 2.6, 40, C.ink, 'left', false);

  // shape index list
  const names = ['KRUG', 'KVADRAT', 'TROUGAO', 'ZVEZDA'];
  const keys = [2.2, 2.85, 3.4, 3.95];
  let active = 0; keys.forEach((k, i) => { if (t >= k - 0.16) active = i; });
  names.forEach((n, i) => {
    const ap = E.outExpo(P(t, 2.4 + i * 0.06, 2.9 + i * 0.06));
    const out = E.inExpo(P(t, 4.05 + i * 0.03, 4.3 + i * 0.03));
    const y = 430 + i * 56;
    const x = 1600 + (1 - ap) * 80 + out * 120;
    ctx.globalAlpha = ap * (1 - out);
    const on = i === active;
    ctx.fillStyle = on ? C.red : C.ink;
    setFont(26, on ? 700 : 400, MONO);
    ctx.fillText(`0${i + 1}  ${n}`, x, y);
    if (on) { ctx.fillRect(x - 34, y - 18, 18, 18); }
    ctx.globalAlpha = 1;
  });
}

/* =========================================================================
   SCENE 3 — TIPOGRAFIJA (4.72 – 7.4): kinetic words + marquee
   ========================================================================= */
const WORDS = [
  { w: 'DIZAJN', s: 4.72, bg: C.red, fg: C.ink },
  { w: 'KOJI', s: 5.05, bg: C.ink, fg: C.lime },
  { w: 'SE', s: 5.40, bg: C.violet, fg: C.cream },
  { w: 'KREĆE.', s: 5.75, bg: C.lime, fg: C.ink },
];
function scene3(t) {
  if (t < 6.3) {
    let k = 0; WORDS.forEach((o, i) => { if (t >= o.s) k = i; });
    const cur = WORDS[k], prev = WORDS[Math.max(0, k - 1)];
    ctx.fillStyle = k === 0 ? cur.bg : prev.bg; ctx.fillRect(0, 0, W, H);
    if (k > 0) {
      const p = E.outExpo(P(t, cur.s, cur.s + 0.16));
      ctx.fillStyle = cur.bg; ctx.fillRect(0, H - p * H, W, p * H);
    }
    // accent stripes behind
    const sp = E.outExpo(P(t, cur.s, cur.s + 0.3));
    ctx.fillStyle = cur.fg; ctx.globalAlpha = 0.12;
    for (let i = 0; i < 5; i++) {
      const y = 140 + i * 200;
      const x0 = (i % 2 ? -1 : 1) * (1 - sp) * W;
      ctx.fillRect(x0, y, W, 6);
    }
    ctx.globalAlpha = 1;

    const size = fitSize(cur.w, 1450, 560);
    const sc = lerp(1.18, 1, E.outExpo(P(t, cur.s, cur.s + 0.4)));
    const sk = lerp(-0.22, 0, E.outExpo(P(t, cur.s, cur.s + 0.35)));
    ctx.save();
    ctx.translate(CX, CY); ctx.scale(sc, sc); ctx.transform(1, 0, sk, 1, 0, 0);
    revealText(cur.w, 0, size * 0.36, size, { t, start: cur.s, dur: 0.28, stagger: 0.022, color: cur.fg });
    ctx.restore();
    // index tag
    setFont(24, 600, MONO); ctx.fillStyle = cur.fg;
    ctx.fillText(`[ 0${k + 1} / 04 ]`, 120, H - 130);
    ctx.textAlign = 'right'; ctx.fillText('KINETIČKA TIPOGRAFIJA', W - 120, H - 130); ctx.textAlign = 'left';
    return;
  }
  // marquee wall
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const enter = E.outExpo(P(t, 6.3, 6.8));
  const sc = lerp(1.6, 1, enter);
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(-0.14); ctx.scale(sc, sc);
  const txt = 'DIZAJN KOJI SE KREĆE — ';
  const size = 150;
  setFont(size, 900);
  const pw = ctx.measureText(txt).width;
  for (let r = -5; r <= 5; r++) {
    const y = r * 158 + size * 0.36;
    const dir = r % 2 ? 1 : -1;
    const off = ((dir * (t - 6.3) * 1100 + r * 371) % pw + pw) % pw;
    const style = r === 0 ? 'red' : (r % 2 ? 'outline' : 'fill');
    setFont(size, 900);
    if (style === 'outline') { ctx.strokeStyle = C.cream; ctx.lineWidth = 2; }
    else ctx.fillStyle = style === 'red' ? C.red : C.cream;
    for (let x = -2600 - off; x < 2600; x += pw) {
      if (style === 'outline') ctx.strokeText(txt, x, y); else ctx.fillText(txt, x, y);
    }
  }
  ctx.restore();
}

/* =========================================================================
   SCENE 4 — PROSTOR (6.95 – 9.9): 3D particle sphere → torus → explode
   ========================================================================= */
function scene4(t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const cx = 1190, cy = 540;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 800);
  g.addColorStop(0, 'rgba(106,76,255,0.28)'); g.addColorStop(1, 'rgba(106,76,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const morphG = E.inOutCubic(P(t, 8.5, 9.35));
  const ry = t * 0.85, rx = 0.35 + Math.sin(t * 0.9) * 0.12 + morphG * 0.75;
  const cY = Math.cos(ry), sY = Math.sin(ry), cX = Math.cos(rx), sX = Math.sin(rx);
  const ex = E.inExpo(P(t, 9.45, 9.85));
  const F = 950, ZOFF = 1250;

  // orbit ring (behind)
  const ringP = E.inOutExpo(P(t, 7.5, 8.4));
  const ringOut = E.inExpo(P(t, 9.35, 9.6));
  const ringPts = [];
  const tilt = 1.25, rcy = Math.cos(t * 0.3), rsy = Math.sin(t * 0.3);
  for (let k = 0; k <= 160; k++) {
    const a = k / 160 * Math.PI * 2 * ringP;
    let x = Math.cos(a) * 540, y = 0, z = Math.sin(a) * 540;
    let y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
    let x3 = x * rcy + z2 * rsy, z3 = -x * rsy + z2 * rcy;
    const s = F / (z3 + ZOFF);
    ringPts.push([cx + x3 * s, cy + y2 * s, z3]);
  }
  if (ringP > 0) {
    ctx.strokeStyle = 'rgba(242,238,230,0.35)'; ctx.lineWidth = 1.5;
    ctx.globalAlpha = 1 - ringOut;
    ctx.beginPath(); ringPts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    // satellites
    for (let s = 0; s < 3; s++) {
      const idx = Math.floor(((t * 0.35 + s / 3) % 1) * 160 * ringP);
      const p = ringPts[clamp(idx, 0, ringPts.length - 1)];
      ctx.fillStyle = s === 0 ? C.red : C.cream;
      ctx.beginPath(); ctx.arc(p[0], p[1], s === 0 ? 9 : 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // particles
  const arr = [];
  for (let i = 0; i < NPTS; i++) {
    const q = PART[i];
    const a = E.outExpo(P(t, 7.05 + q.d1 * 0.5, 7.85 + q.d1 * 0.5));
    const m = E.inOutCubic(P(t, 8.5 + q.d2 * 0.3, 9.1 + q.d2 * 0.3));
    let x = lerp(lerp(q.rnd[0], q.sph[0], a), q.tor[0], m);
    let y = lerp(lerp(q.rnd[1], q.sph[1], a), q.tor[1], m);
    let z = lerp(lerp(q.rnd[2], q.sph[2], a), q.tor[2], m);
    const pulse = 1 + Math.sin(t * 6 + q.d1 * 12) * 0.02;
    const k = (1 + ex * (4 + q.d1 * 6)) * pulse;
    x *= k; y *= k; z *= k;
    const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
    const y2 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    const zz = z2 + ZOFF;
    if (zz < 60) continue;
    const s = F / zz;
    arr.push([z2, cx + x1 * s, cy + y2 * s, s]);
  }
  arr.sort((a, b) => b[0] - a[0]);
  for (const [z, px, py, s] of arr) {
    const d = clamp((z + 400) / 800);
    ctx.fillStyle = PAL3D[Math.round(d * 23)];
    ctx.globalAlpha = 0.45 + 0.55 * (1 - d);
    ctx.beginPath(); ctx.arc(px, py, Math.max(0.8, 5.2 * s), 0, Math.PI * 2); ctx.fill();
    if (d < 0.35) { ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.arc(px, py, 14 * s, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  // typography
  revealText('PROSTOR', 140, 600, 168, { t, start: 7.35, dur: 0.6, stagger: 0.035, color: C.cream, align: 'left', exitStart: 9.3, exitDur: 0.35 });
  typeText('04 — 3D · čestice · dubina', 146, 660, 22, t, 7.7, 40, C.cream, 'left', false);

  // tech readout
  if (t > 7.8 && t < 9.5) {
    setFont(16, 500, MONO); ctx.fillStyle = 'rgba(242,238,230,0.6)';
    const lines = [
      `ROT.Y   ${((ry * 180 / Math.PI) % 360).toFixed(1).padStart(6)}°`,
      `ROT.X   ${(rx * 180 / Math.PI).toFixed(1).padStart(6)}°`,
      `PTS     ${String(NPTS).padStart(6)}`,
      `MORPH   ${morphG.toFixed(2).padStart(6)}`,
    ];
    lines.forEach((l, i) => ctx.fillText(l, 146, 760 + i * 26));
  }
}

/* =========================================================================
   SCENE 5 — PODACI (9.82 – 12.45): counters, bars, line, ring
   ========================================================================= */
const BARS = [34, 48, 41, 63, 57, 76, 70, 88, 100];
function scene5(t) {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);

  revealText('U BROJEVIMA', 140, 250, 112, { t, start: 9.9, dur: 0.55, stagger: 0.03, color: C.ink, align: 'left' });

  // counters
  const rows = [
    { v: 120, suf: '+', pad: 0, label: 'PROJEKATA' },
    { v: 8, suf: '', pad: 2, label: 'GODINA ISKUSTVA' },
    { v: 40, suf: 'M', pad: 0, label: 'PREGLEDA' },
  ];
  rows.forEach((r, i) => {
    const s = 10.05 + i * 0.14;
    const y = 470 + i * 175;
    const p = E.outExpo(P(t, s, s + 1.3));
    const val = String(Math.round(r.v * p)).padStart(r.pad, '0') + r.suf;
    // mask rise for number
    const rise = (1 - E.outExpo(P(t, s, s + 0.5))) * 160;
    ctx.save(); ctx.beginPath(); ctx.rect(120, y - 150, 440, 170); ctx.clip();
    setFont(140, 900); ctx.fillStyle = i === 0 ? C.red : C.ink; ctx.fillText(val, 140, y + rise);
    ctx.restore();
    ctx.globalAlpha = E.outExpo(P(t, s + 0.2, s + 0.6));
    setFont(22, 600, MONO); ctx.fillStyle = C.ink; ctx.fillText(r.label, 580, y - 50);
    ctx.globalAlpha = 1;
    const lw = E.inOutExpo(P(t, s + 0.05, s + 0.75)) * 760;
    ctx.fillStyle = C.ink; ctx.fillRect(140, y + 36, lw, 2);
  });

  // bar chart
  const bx = 1060, base = 880, bw = 54, gap = 26, maxH = 400;
  const axis = E.inOutExpo(P(t, 10.0, 10.6));
  ctx.fillStyle = C.ink; ctx.fillRect(bx - 20, base, axis * (BARS.length * (bw + gap) + 20), 2);
  const tops = [];
  BARS.forEach((v, i) => {
    const s = 10.15 + i * 0.06;
    const p = E.outBack(P(t, s, s + 0.65));
    const h = v / 100 * maxH * p;
    const x = bx + i * (bw + gap);
    ctx.fillStyle = i === BARS.length - 1 ? C.red : C.ink;
    ctx.fillRect(x, base - h, bw, h);
    tops.push([x + bw / 2, base - v / 100 * maxH - 46]);
  });
  // line chart drawing over bars
  const lp = E.inOutCubic(P(t, 10.55, 11.6));
  if (lp > 0) {
    const total = tops.length - 1, upto = lp * total;
    ctx.strokeStyle = C.violet; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tops[0][0], tops[0][1]);
    let hx = tops[0][0], hy = tops[0][1];
    for (let i = 1; i <= Math.ceil(upto); i++) {
      const f = Math.min(1, upto - (i - 1));
      hx = lerp(tops[i - 1][0], tops[i][0], f); hy = lerp(tops[i - 1][1], tops[i][1], f);
      ctx.lineTo(hx, hy);
    }
    ctx.stroke();
    ctx.fillStyle = C.violet; ctx.beginPath(); ctx.arc(hx, hy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.violet; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy, 11 + (t * 40 % 22), 0, Math.PI * 2);
    ctx.globalAlpha = 1 - (t * 40 % 22) / 22; ctx.stroke(); ctx.globalAlpha = 1;
  }

  // progress ring
  const rcx = 1690, rcy = 250, rr_ = 82;
  const rp = E.outExpo(P(t, 10.3, 11.6));
  const ra = E.outBack(P(t, 10.2, 10.6));
  ctx.save(); ctx.translate(rcx, rcy); ctx.scale(ra, ra);
  ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(11,11,15,0.1)'; ctx.beginPath(); ctx.arc(0, 0, rr_, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = C.red; ctx.beginPath(); ctx.arc(0, 0, rr_, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.98 * rp); ctx.stroke();
  setFont(46, 900); ctx.fillStyle = C.ink; ctx.textAlign = 'center';
  ctx.fillText(Math.round(98 * rp) + '%', 0, 16);
  ctx.restore(); ctx.textAlign = 'left';
  ctx.globalAlpha = E.outExpo(P(t, 10.5, 10.9));
  setFont(20, 600, MONO); ctx.fillStyle = C.ink; ctx.textAlign = 'right';
  ctx.fillText('ZADOVOLJNIH', rcx - 120, rcy - 6);
  ctx.fillText('KLIJENATA', rcx - 120, rcy + 22);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

/* =========================================================================
   SCENE 6 — KRAJ (12.1 – 15): logo lock-up
   ========================================================================= */
function scene6(t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const push = lerp(1, 1.045, E.inOutCubic(P(t, 12.3, 15)));
  ctx.save(); ctx.translate(CX, CY); ctx.scale(push, push); ctx.translate(-CX, -CY);

  // glow
  const gl = E.outExpo(P(t, 13.0, 14.0));
  const g = ctx.createRadialGradient(CX, 380, 0, CX, 380, 700);
  g.addColorStop(0, `rgba(255,59,47,${0.16 * gl})`); g.addColorStop(1, 'rgba(255,59,47,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const shapes = [
    { col: C.red, dx: -140, kind: 'circle' },
    { col: C.lime, dx: 0, kind: 'square' },
    { col: C.violet, dx: 140, kind: 'tri' },
  ];
  shapes.forEach((s, i) => {
    const st = 12.35 + i * 0.09;
    const p = E.outExpo(P(t, st, st + 0.85));
    const sc = E.outBack(P(t, st, st + 0.5));
    const ang = i * 2.1 + (1 - p) * Math.PI * 3.2;
    const rad = (1 - p) * 520;
    const x = CX + s.dx + Math.cos(ang) * rad, y = 400 + Math.sin(ang) * rad * 0.6;
    const land = bump(t, 13.2 + i * 0.07, 13.45 + i * 0.07);
    ctx.save(); ctx.translate(x, y + land * 10); ctx.scale(sc * (1 + land * 0.18), sc * (1 - land * 0.18));
    ctx.rotate((1 - p) * Math.PI * 2);
    ctx.fillStyle = s.col;
    if (s.kind === 'circle') { ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill(); }
    if (s.kind === 'square') { ctx.fillRect(-45, -45, 90, 90); }
    if (s.kind === 'tri') { ctx.beginPath(); ctx.moveTo(0, -56); ctx.lineTo(52, 42); ctx.lineTo(-52, 42); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  });

  revealText('MOTION DESIGNER', CX, 640, 128, { t, start: 12.95, dur: 0.6, stagger: 0.028, color: C.cream, tracking: 6 });
  const lw = E.inOutExpo(P(t, 13.4, 14.0)) * 640;
  ctx.fillStyle = C.red; ctx.fillRect(CX - lw / 2, 688, lw, 4);
  typeText('SHOWREEL 2026  ·  DOSTUPAN ZA NOVE PROJEKTE', CX - 300, 760, 22, t, 13.6, 70, C.cream, 'left', true);
  ctx.restore();
}

/* =========================================================================
   HUD overlay
   ========================================================================= */
function hudColor(t) {
  if (t >= 2.05 && t < 4.72) return C.ink;
  if (t >= 4.72 && t < 6.3) {
    let k = 0; WORDS.forEach((o, i) => { if (t >= o.s) k = i; });
    return WORDS[k].fg;
  }
  if (t >= 9.82 && t < 12.3) return C.ink;
  return C.cream;
}
function sceneLabel(t) {
  if (t < 2.2) return '01 / UVOD';
  if (t < 4.72) return '02 / FORMA';
  if (t < 7.2) return '03 / TIPOGRAFIJA';
  if (t < 9.82) return '04 / PROSTOR';
  if (t < 12.3) return '05 / PODACI';
  return '06 / KRAJ';
}
function hud(t) {
  const a = E.outCubic(P(t, 0.25, 0.8)) * (1 - P(t, 14.75, 15));
  if (a <= 0) return;
  const col = hudColor(t);
  ctx.globalAlpha = a;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  const m = 48, L = 30;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  setFont(16, 600, MONO);
  ctx.fillText('SHOWREEL ’26 — MOTION DESIGN', 92, 86);
  ctx.textAlign = 'right'; ctx.fillText(sceneLabel(t), W - 92, 86);
  const f = Math.floor(t * 60);
  const tc = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 60).padStart(2, '0')}`;
  ctx.fillText(tc, W - 92, H - 76);
  ctx.textAlign = 'left';
  // REC
  ctx.fillStyle = C.red;
  if (Math.floor(t * 2) % 2 === 0) { ctx.beginPath(); ctx.arc(100, H - 82, 6, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = col; ctx.fillText('REC  1920×1080  60FPS', 116, H - 76);
  // progress bar
  ctx.globalAlpha = a * 0.25; ctx.fillRect(CX - 150, H - 84, 300, 2);
  ctx.globalAlpha = a; ctx.fillRect(CX - 150, H - 84, 300 * (t / DURATION), 2);
  ctx.globalAlpha = 1;
}

/* =========================================================================
   COMPOSITOR
   ========================================================================= */
function clipCircle(r) { ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.clip(); }

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shake(t);
  ctx.save(); ctx.translate(sx, sy);
  ctx.fillStyle = C.ink; ctx.fillRect(-40, -40, W + 80, H + 80);

  if (t < 1.85) scene1(t);
  else if (t < 2.25) {                       // circle wipe 1 → 2
    scene1(t);
    ctx.save(); clipCircle(E.inOutExpo(P(t, 1.85, 2.22)) * 1150); scene2(t); ctx.restore();
  }
  else if (t < 4.72) scene2(t);
  else if (t < 6.95) scene3(t);
  else if (t < 7.45) {                       // slat wipe 3 → 4
    scene3(t);
    ctx.save(); ctx.beginPath();
    const n = 12, sw = W / n;
    for (let i = 0; i < n; i++) {
      const p = E.inOutExpo(P(t, 6.95 + i * 0.018, 7.2 + i * 0.018));
      ctx.rect(i * sw - 1, -40, (sw + 2) * p, H + 80);
    }
    ctx.clip(); scene4(t); ctx.restore();
  }
  else if (t < 9.82) scene4(t);
  else if (t < 12.1) scene5(t);
  else if (t < 12.55) {                      // diagonal wipe 5 → 6
    scene5(t);
    const e = lerp(-700, W + 700, E.inOutExpo(P(t, 12.1, 12.5)));
    ctx.fillStyle = C.red;
    ctx.beginPath(); ctx.moveTo(-1200, -40); ctx.lineTo(e + 90, -40); ctx.lineTo(e - 410, H + 40); ctx.lineTo(-1200, H + 40); ctx.fill();
    ctx.save(); ctx.beginPath();
    ctx.moveTo(-1200, -40); ctx.lineTo(e, -40); ctx.lineTo(e - 500, H + 40); ctx.lineTo(-1200, H + 40); ctx.clip();
    scene6(t); ctx.restore();
  }
  else scene6(t);
  ctx.restore();

  // white flash 4 → 5
  const fl = Math.max(E.outCubic(P(t, 9.62, 9.82)) * (t < 9.82 ? 1 : 0), t >= 9.82 ? 1 - E.outCubic(P(t, 9.82, 10.05)) : 0);
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }

  hud(t);

  // vignette
  const vg = ctx.createRadialGradient(CX, CY, H * 0.45, CX, CY, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // film grain
  const fr = Math.floor(t * 60);
  ctx.save();
  ctx.globalAlpha = 0.045; ctx.globalCompositeOperation = 'overlay';
  ctx.translate((fr * 73) % 256, (fr * 151) % 256);
  ctx.fillStyle = grainPat; ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();

  // final fade
  const fo = P(t, 14.75, 15);
  if (fo > 0) { ctx.fillStyle = `rgba(11,11,15,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.DURATION = DURATION;

/* realtime preview when opened directly (?render disables it) */
window.ready = document.fonts.load(`900 100px ${FONT}`)
  .then(() => document.fonts.load(`500 20px ${MONO}`))
  .then(() => document.fonts.load(`600 20px ${MONO}`))
  .then(() => document.fonts.load(`700 20px ${MONO}`))
  .then(() => document.fonts.ready);
if (!location.search.includes('render')) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
