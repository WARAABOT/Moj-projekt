name: Make and upload videos

on:
  schedule:
    - cron: "41 13 * * *"   # every day 13:41 UTC (morning in the US)
  workflow_dispatch:        # "Run workflow" button for manual/test runs
    inputs:
      channel:
        description: "Channel (history, money, science, stories, gta6) or all"
        default: all
      format:
        description: "auto, short, long or both"
        default: auto
      upload:
        description: "Upload to YouTube?"
        type: boolean
        default: true

permissions:
  contents: write           # to save history/*.json (topics already used)

concurrency: videos

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Get scripts from the content branch (written daily by Claude Code)
        run: |
          if git fetch --depth 1 origin content; then
            git worktree add --detach "$RUNNER_TEMP/content" FETCH_HEAD
            echo "QUEUE_DIR=$RUNNER_TEMP/content/queue" >> "$GITHUB_ENV"
          fi

      - name: Make videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, only if the queue is empty
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          YT_TOKEN_HISTORY: ${{ secrets.YT_TOKEN_HISTORY }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
          YT_TOKEN_SCIENCE: ${{ secrets.YT_TOKEN_SCIENCE }}
          YT_TOKEN_STORIES: ${{ secrets.YT_TOKEN_STORIES }}
          YT_TOKEN_GTA6: ${{ secrets.YT_TOKEN_GTA6 }}
        run: >
          python -m faceless.main
          --channel "${{ inputs.channel || 'all' }}"
          --format "${{ inputs.format || 'auto' }}"
          ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && '--no-upload' || '' }}

      - name: Read views and subscribers
        if: always()
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_HISTORY: ${{ secrets.YT_TOKEN_HISTORY }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
          YT_TOKEN_SCIENCE: ${{ secrets.YT_TOKEN_SCIENCE }}
          YT_TOKEN_STORIES: ${{ secrets.YT_TOKEN_STORIES }}
          YT_TOKEN_GTA6: ${{ secrets.YT_TOKEN_GTA6 }}
        run: python -m faceless.stats

      - name: Keep the videos for 7 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save used topics and stats
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          mkdir -p history stats && git add history/ stats/
          git diff --cached --quiet || (git commit -m "Video history and stats $(date -u +%F)" && git push)
